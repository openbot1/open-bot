name: Native draft release

# Deliberately manual-only. Never package or upload a release from a PR or push.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact version tag already present on the approved source commit (for example v0.2.0)
        required: true
        type: string
      target:
        description: One native target per run; repeat sequentially for the remaining platforms
        required: true
        type: choice
        options:
          - mac
          - win
          - linux

permissions:
  contents: write

# Serialize all target uploads for a tag so electron-builder does not race
# multiple draft-release mutations.
concurrency:
  group: native-draft-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Require dispatch from the default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main; the selected input tag is checked out separately."
            exit 1
          fi

      - name: Checkout the requested release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind tag, root version and immutable source SHA
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const tag = process.env.RELEASE_TAG;
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = manifest.version;
          if (typeof version !== 'string' || !/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error('Root package.json has no valid release version.');
          }

          const escapedVersion = version.split('.').join('\\\\.');
          const tagPattern = new RegExp(
            '^v' + escapedVersion + '(?:-(?:dogfood|nightly|lab)(?:\\\\.[0-9A-Za-z.-]+)?)?$',
          );
          if (!tagPattern.test(tag)) {
            throw new Error(`Requested tag ${tag} does not match root version ${version}.`);
          }

          const describedTag = execFileSync('git', ['describe', '--tags', '--exact-match', 'HEAD'], {
            encoding: 'utf8',
          }).trim();
          if (describedTag !== tag) {
            throw new Error(`Checked-out source is tagged ${describedTag}, not requested tag ${tag}.`);
          }

          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/i.test(sourceSha)) throw new Error('Unable to resolve a full source commit SHA.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${sourceSha}\\n`);
          console.log(`Validated ${tag} at source ${sourceSha}.`);
          NODE

  release-mac:
    name: Build, test, sign and upload macOS draft artifacts
    if: inputs.target == 'mac'
    needs: validate-release-ref
    runs-on: macos-latest
    environment: release
    timeout-minutes: 120
    steps:
      - name: Checkout validated source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-ref.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized versions
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Platform tests
        run: node --test tests/platform.test.mjs

      - name: Build, sign, notarize and upload to the draft Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run release:mac

      - name: Confirm GitHub kept the Release as a draft and uploaded DMG assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/openbot1/open-bot/releases/tags/${encodeURIComponent(process.env.RELEASE_TAG)}`,
            { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } },
          );
          if (!response.ok) throw new Error(`GitHub Releases API returned HTTP ${response.status}`);
          const release = await response.json();
          if (release.tag_name !== process.env.RELEASE_TAG || release.draft !== true) {
            throw new Error('Expected the exact requested release tag to remain a draft.');
          }
          const assets = (release.assets ?? []).filter((asset) =>
            typeof asset.name === 'string' && asset.name.toLowerCase().endsWith('.dmg'),
          );
          if (assets.length === 0 || assets.some((asset) =>
            asset.state !== 'uploaded' || !Number.isSafeInteger(asset.size) || asset.size <= 0 ||
            !/^sha256:[a-f0-9]{64}$/i.test(asset.digest ?? ''),
          )) {
            throw new Error('Draft Release has no complete DMG upload with valid size and SHA-256 metadata.');
          }
          console.log(`Draft ${release.tag_name}: ${assets.length} uploaded DMG asset(s); still unpublished.`);
          NODE

  release-win:
    name: Build, test, Authenticode-sign and upload Windows draft artifacts
    if: inputs.target == 'win'
    needs: validate-release-ref
    runs-on: windows-latest
    environment: release
    timeout-minutes: 120
    steps:
      - name: Checkout validated source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-ref.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized versions
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Platform tests
        run: node --test tests/platform.test.mjs

      - name: Build, Authenticode-sign and upload to the draft Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release:win

      - name: Confirm GitHub kept the Release as a draft and uploaded NSIS assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/openbot1/open-bot/releases/tags/${encodeURIComponent(process.env.RELEASE_TAG)}`,
            { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } },
          );
          if (!response.ok) throw new Error(`GitHub Releases API returned HTTP ${response.status}`);
          const release = await response.json();
          if (release.tag_name !== process.env.RELEASE_TAG || release.draft !== true) {
            throw new Error('Expected the exact requested release tag to remain a draft.');
          }
          const assets = (release.assets ?? []).filter((asset) =>
            typeof asset.name === 'string' && asset.name.toLowerCase().endsWith('.exe'),
          );
          if (assets.length === 0 || assets.some((asset) =>
            asset.state !== 'uploaded' || !Number.isSafeInteger(asset.size) || asset.size <= 0 ||
            !/^sha256:[a-f0-9]{64}$/i.test(asset.digest ?? ''),
          )) {
            throw new Error('Draft Release has no complete NSIS upload with valid size and SHA-256 metadata.');
          }
          console.log(`Draft ${release.tag_name}: ${assets.length} uploaded EXE asset(s); still unpublished.`);
          NODE

  release-linux:
    name: Build and upload unsigned Linux draft artifacts
    if: inputs.target == 'linux'
    needs: validate-release-ref
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 120
    steps:
      - name: Checkout validated source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-ref.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized versions
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite (under Xvfb)
        run: xvfb-run -a npm test

      - name: Platform tests
        run: node --test tests/platform.test.mjs

      - name: Build and upload the unsigned AppImage to the draft Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release:linux

      - name: Confirm GitHub kept the Release as a draft and uploaded AppImage assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/openbot1/open-bot/releases/tags/${encodeURIComponent(process.env.RELEASE_TAG)}`,
            { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } },
          );
          if (!response.ok) throw new Error(`GitHub Releases API returned HTTP ${response.status}`);
          const release = await response.json();
          if (release.tag_name !== process.env.RELEASE_TAG || release.draft !== true) {
            throw new Error('Expected the exact requested release tag to remain a draft.');
          }
          const assets = (release.assets ?? []).filter((asset) =>
            typeof asset.name === 'string' && asset.name.toLowerCase().endsWith('.appimage'),
          );
          if (assets.length === 0 || assets.some((asset) =>
            asset.state !== 'uploaded' || !Number.isSafeInteger(asset.size) || asset.size <= 0 ||
            !/^sha256:[a-f0-9]{64}$/i.test(asset.digest ?? ''),
          )) {
            throw new Error('Draft Release has no complete AppImage upload with valid size and SHA-256 metadata.');
          }
          console.log(`Draft ${release.tag_name}: ${assets.length} uploaded AppImage asset(s); unsigned by policy.`);
          NODE
